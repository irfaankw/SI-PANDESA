{% load static %}

<div x-data="authModal()"
     x-show="$store.auth.open"
     x-cloak
     @keydown.escape.window="$store.auth.close()"
     class="fixed inset-0 z-[100] flex items-center justify-center p-4">

    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         @click="$store.auth.close()"></div>

    <div class="relative z-10 w-full max-w-sm rounded-2xl bg-white shadow-2xl flex flex-col"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95">

        <!-- Header -->
        <div class="flex items-center gap-3 rounded-t-2xl bg-emerald-600 px-5 py-4 shrink-0">
            <img src="{% static 'assets/official/Logo-Desa-Sungai-Meriam.png' %}"
                 alt="Logo" class="h-10 w-10 rounded-lg object-contain bg-white p-1">
            <div>
                <p class="text-xs text-emerald-100">Selamat datang di</p>
                <p class="text-base font-bold text-white">SI-PANDESA</p>
            </div>
            <button @click="$store.auth.close()"
                    class="ml-auto flex h-7 w-7 items-center justify-center rounded-full text-emerald-100 hover:bg-emerald-700 hover:text-white transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 flex flex-col gap-5" x-data="otpAuth()"
             x-effect="if (!$store.auth.open) { step = 'email'; code = ''; error = ''; }">

            {% csrf_token %}

            <!-- STEP 1: email -->
            <template x-if="step === 'email'">
                <div class="flex flex-col gap-5">
                    <p class="text-center text-sm text-slate-500">Masuk untuk mengakses layanan desa</p>

                    <a href="{% url 'google_login' %}?next=/"
                       class="flex items-center justify-center gap-3 w-full rounded-xl border border-slate-200 bg-white hover:bg-slate-50 py-3 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-px hover:shadow-md">
                        <svg viewBox="0 0 24 24" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Lanjutkan dengan Google
                    </a>

                    <div class="flex items-center gap-3">
                        <div class="flex-1 h-px bg-slate-200"></div>
                        <span class="text-xs text-slate-400 uppercase tracking-wide">atau</span>
                        <div class="flex-1 h-px bg-slate-200"></div>
                    </div>

                    <form @submit.prevent="requestOtp" class="flex flex-col gap-3">
                        <input type="email" x-model="email" required
                               placeholder="Masukkan email kamu"
                               class="w-full rounded-xl border border-slate-200 bg-white py-3 px-4 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <p x-show="error" x-text="error" class="text-xs text-red-600"></p>
                        <button type="submit" :disabled="loading"
                                class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-50 py-3 text-sm font-semibold text-white transition-colors duration-200">
                            <span x-show="!loading">Lanjutkan dengan email</span>
                            <span x-show="loading">Mengirim kode...</span>
                        </button>
                    </form>

                    <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
                        <p class="text-xs text-amber-800 leading-relaxed">
                            💡 Akun baru perlu diverifikasi oleh petugas desa sebelum bisa mengakses semua layanan.
                        </p>
                    </div>
                </div>
            </template>

            <!-- STEP 2: kode terkirim (mirror foto 2) -->
            <template x-if="step === 'sent'">
                <div class="flex flex-col items-center gap-4 text-center py-2">
                    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-7 w-7">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="m3 7 9 6 9-6"/>
                        </svg>
                    </div>
                    <p class="text-sm text-slate-500">
                        Kode verifikasi telah dikirim ke<br>
                        <span class="font-semibold text-slate-700" x-text="email"></span>
                    </p>
                    <div class="flex flex-col gap-2 text-sm pt-1">
                        <button type="button" @click="step = 'otp'"
                                class="font-semibold text-emerald-700 hover:underline">
                            Masukkan kode verifikasi
                        </button>
                        <button type="button" @click="backToEmail()"
                                class="text-slate-500 hover:text-slate-700 hover:underline">
                            Kirim ulang kode
                        </button>
                        <button type="button" @click="useNewEmail()"
                                class="text-slate-500 hover:text-slate-700 hover:underline">
                            Gunakan email lain
                        </button>
                    </div>
                </div>
            </template>

            <!-- STEP 3: input kode OTP (mirror foto 3) -->
            <template x-if="step === 'otp'">
                <form @submit.prevent="verifyOtp" class="flex flex-col gap-3 text-center">
                    <p class="text-sm text-slate-500">
                        Masukkan kode verifikasi yang dikirim ke<br>
                        <span class="font-semibold text-slate-700" x-text="email"></span>
                    </p>
                    <input type="text" x-model="code" inputmode="numeric" maxlength="6" required
                           placeholder="••••••"
                           class="w-full rounded-xl border border-slate-200 bg-white py-3 px-4 text-center text-lg tracking-[0.5em] text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <p x-show="error" x-text="error" class="text-xs text-red-600"></p>
                    <button type="submit" :disabled="loading"
                            class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-50 py-3 text-sm font-semibold text-white transition-colors duration-200">
                        <span x-show="!loading">Verifikasi Email</span>
                        <span x-show="loading">Memverifikasi...</span>
                    </button>
                    <p class="text-xs text-slate-400">
                        Tidak menerima kode?
                        <button type="button" @click="backToEmail()" class="underline hover:text-slate-600">Kirim ulang</button>
                        ·
                        <button type="button" @click="useNewEmail()" class="underline hover:text-slate-600">Ganti email</button>
                    </p>
                </form>
            </template>

        </div>

    </div>
</div>

<script>
(function () {
    document.addEventListener('alpine:init', () => {
        Alpine.data('authModal', () => ({
            init() {}
        }));

        Alpine.data('otpAuth', () => ({
            step: 'email',
            email: '',
            code: '',
            loading: false,
            error: '',

            csrfToken() {
                return document.querySelector('[name=csrfmiddlewaretoken]').value;
            },

            backToEmail() {
                this.step = 'email';
                this.code = '';
                this.error = '';
            },

            useNewEmail() {
                this.step = 'email';
                this.code = '';
                this.error = '';
                this.email = '';
            },

            async requestOtp() {
                this.loading = true;
                this.error = '';
                try {
                    const res = await fetch("{% url 'account:otp_request' %}", {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': this.csrfToken(),
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `email=${encodeURIComponent(this.email)}`,
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.email = data.email;
                        this.step = 'sent';
                    } else {
                        this.error = data.error;
                    }
                } catch (e) {
                    this.error = 'Gagal menghubungi server, coba lagi.';
                } finally {
                    this.loading = false;
                }
            },

            async verifyOtp() {
                this.loading = true;
                this.error = '';
                try {
                    const res = await fetch("{% url 'account:otp_verify' %}", {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': this.csrfToken(),
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `code=${encodeURIComponent(this.code)}`,
                    });
                    const data = await res.json();
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        this.error = data.error;
                    }
                } catch (e) {
                    this.error = 'Gagal menghubungi server, coba lagi.';
                } finally {
                    this.loading = false;
                }
            },
        }));
    });
})();
</script>

{% if request.GET.auth_modal %}
<script>
document.addEventListener('alpine:init', () => {
    Alpine.store('auth').open = true;
});
</script>
{% endif %}
